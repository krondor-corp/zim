[package]
name = "zim-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim core: the vault data model — filesystem, content store, linked data. Iroh-free, wasm-clean."
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_core"
path = "src/lib.rs"

[dependencies]
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }
# `Did` in shares/entries. zim-did is pure (types + codec + resolver
# trait); the HTTP resolver lives in zim-api.
zim-did = { path = "../zim-did", version = "0.1.0" }
futures = { workspace = true }

# Core (always present)
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"

# Serialization (always)
serde = { workspace = true }
serde_with = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }

# Time / logging (always)
chrono = { workspace = true }
tracing = { workspace = true }

# Content addressing / IPLD (always)
cid = { workspace = true }
ipld-core = { workspace = true }
multihash = "0.19"

# Randomness (genesis nonce) — wasm_js backend for WASM targets
getrandom = { version = "0.2", features = ["js"] }

# Hashing (always)
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"

# Mime (always — used in fs/entry.rs)
mime = "0.3.17"
mime_guess = "2.0"
mime_serde_shim = "0.2.2"

# ref-cast (always)
ref-cast = "1.0"

# derive_more (always)
derive_more = { version = "2.0", features = ["from"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
