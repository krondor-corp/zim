[package]
name = "zim-peer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim peer: the network-participating runtime — sync orchestration, vault adapter, sqlite/memory vault logs, peer store, iroh wire protocol"
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_peer"
path = "src/lib.rs"

[dependencies]
zim-core = { path = "../zim-core", version = "0.1.0" }
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }
zim-did = { path = "../zim-did", version = "0.1.0" }
zim-runtime = { path = "../zim-runtime", version = "0.1.0" }

anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
# `paste` powers the `wire_protocol!` macro's snake-case method name
# generation (variant `Head` → method `send_head`). No-op at runtime;
# pure compile-time identifier-concatenation.
paste = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
serde = { workspace = true }

# object_store backend (moved from zim-core): S3/local blob storage
# bridged into iroh-blobs via the store actor.
object_store = { version = "0.11", features = ["aws"] }
iroh-blobs = { workspace = true }
irpc = { version = "0.9.0", features = ["rpc", "stream", "derive"], default-features = false }
bao-tree = { version = "0.15.1", features = ["experimental-mixed", "serde"], default-features = false }
range-collections = { version = "0.4.6", features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
