name: Create Release PR

# Ported from jax-fs's cargo-smart-release train. On main pushes:
# figure out whether a release is needed (unpublished crates, or
# conventional commits since the last zim-peer tag), run
# `cargo smart-release` for the published lib stack (no publish, no
# tags — publish-crate.yml does both after the PR merges), hand-bump
# the unpublished `zim` binary (crates.io name is taken; it ships as
# GitHub-Release binaries via zim-v* tags), and open/update the
# release-automation PR.

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  release-pr:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    # CRITICAL: Skip if this is a release PR merge to prevent infinite loop
    if: "!contains(github.event.head_commit.message, 'Bump zim-') && !contains(github.event.head_commit.message, 'chore: initial publish of zim-')"
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for smart-release
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Install cargo-smart-release
        run: cargo install cargo-smart-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if release is needed
        id: check
        run: |
          # Check if any crates are unpublished on crates.io using the API
          UNPUBLISHED=""
          for crate in zim-crypto zim-did zim-core zim-api zim-peer; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: zim-release-workflow" "https://crates.io/api/v1/crates/$crate")
            if [ "$HTTP_STATUS" = "404" ]; then
              echo "Crate $crate is not published on crates.io"
              UNPUBLISHED="$UNPUBLISHED $crate"
            else
              echo "Crate $crate exists on crates.io (HTTP $HTTP_STATUS)"
            fi
          done

          if [ -n "$UNPUBLISHED" ]; then
            echo "Unpublished crates found:$UNPUBLISHED"
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "reason=unpublished_crates" >> $GITHUB_OUTPUT
            echo "unpublished=$UNPUBLISHED" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the latest release tag (top of the published lib stack)
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "zim-peer-v*" 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found, will create initial release"
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "reason=no_previous_release" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest release tag: $LATEST_TAG"

          # Check if there are conventional commits since the last tag
          COMMIT_COUNT=$(git log "$LATEST_TAG"..HEAD --oneline --grep="^feat\|^fix\|^feat!\|BREAKING CHANGE" | wc -l)

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "Found $COMMIT_COUNT conventional commits since $LATEST_TAG"
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "reason=new_commits" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Also check if the zim binary has unreleased changes
          # (smart-release can't detect these: it's publish=false)
          LATEST_ZIM_TAG=$(git describe --tags --abbrev=0 --match "zim-v*" 2>/dev/null || echo "")
          if [ -n "$LATEST_ZIM_TAG" ]; then
            ZIM_CHANGES=$(git diff --name-only "$LATEST_ZIM_TAG"..HEAD -- crates/zim/ | wc -l | tr -d ' ')
            if [ "$ZIM_CHANGES" -gt 0 ]; then
              echo "Found $ZIM_CHANGES zim binary file changes since $LATEST_ZIM_TAG"
              echo "needs_release=true" >> $GITHUB_OUTPUT
              echo "reason=new_commits" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "No conventional commits or zim binary changes - skipping release PR"
          echo "needs_release=false" >> $GITHUB_OUTPUT

      - name: Create/update release branch
        if: steps.check.outputs.needs_release == 'true'
        run: |
          # Delete remote release-automation branch if it exists to start fresh
          git fetch origin
          if git ls-remote --heads origin release-automation | grep -q release-automation; then
            echo "Deleting existing release-automation branch on remote..."
            git push origin --delete release-automation || true
          fi

          # Create fresh release branch from main
          git checkout -b release-automation

      - name: Run cargo smart-release (for publishable crates)
        id: smart-release
        if: steps.check.outputs.needs_release == 'true' && steps.check.outputs.reason != 'unpublished_crates'
        run: |
          # Execute release: updates files, creates commits, but NO TAGS
          # Tags will be created by publish workflow after PR is merged
          # Note: the zim binary is publish=false so smart-release can't
          # handle it; it gets bumped in the next step instead.
          if cargo smart-release zim-peer \
            --execute \
            --no-publish \
            --no-tag \
            --allow-dirty \
            --update-crates-index; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "smart-release found no crate changes to release"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump zim binary version if needed
        id: zim-bump
        if: steps.check.outputs.needs_release == 'true' && steps.check.outputs.reason != 'unpublished_crates'
        run: |
          # The zim binary is publish=false (name taken on crates.io), so
          # cargo smart-release skips it. Bump its patch version when its
          # files changed OR the libs it embeds were bumped.
          LATEST_ZIM_TAG=$(git describe --tags --abbrev=0 --match "zim-v*" 2>/dev/null || echo "")

          NEEDS_BUMP=false
          if [ -z "$LATEST_ZIM_TAG" ]; then
            echo "No previous zim release tag — will bump"
            NEEDS_BUMP=true
          else
            # Check for zim-specific changes
            ZIM_CHANGES=$(git diff --name-only "$LATEST_ZIM_TAG"..HEAD -- crates/zim/ | wc -l | tr -d ' ')
            echo "zim file changes since $LATEST_ZIM_TAG: $ZIM_CHANGES"

            # Check if the lib stack was bumped (zim embeds it)
            LIBS_BUMPED=false
            if git log --oneline "$LATEST_ZIM_TAG"..HEAD | grep -q "Bump zim-peer\|Bump zim-core\|Bump zim-crypto\|Bump zim-did\|Bump zim-api"; then
              LIBS_BUMPED=true
            fi
            echo "Libs bumped since last zim release: $LIBS_BUMPED"

            if [ "$ZIM_CHANGES" -gt 0 ] || [ "$LIBS_BUMPED" = "true" ]; then
              NEEDS_BUMP=true
            fi
          fi

          if [ "$NEEDS_BUMP" = "false" ]; then
            echo "No zim-relevant changes — skipping bump"
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Read current version and bump patch
          CURRENT=$(grep '^version' crates/zim/Cargo.toml | head -1 | cut -d'"' -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping zim $CURRENT -> $NEW_VERSION"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" crates/zim/Cargo.toml

          # Update Cargo.lock to reflect the new version
          cargo generate-lockfile

          git add crates/zim/Cargo.toml Cargo.lock
          git commit -m "Bump zim v$NEW_VERSION"
          echo "bumped=true" >> $GITHUB_OUTPUT

      - name: Create marker commit (for unpublished crates)
        id: unpublished
        if: steps.check.outputs.needs_release == 'true' && steps.check.outputs.reason == 'unpublished_crates'
        run: |
          # For unpublished crates, create a marker commit with timestamp
          # The publish workflow will handle the actual publish
          echo "Initial publish of new crates - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .initial-publish
          git add .initial-publish
          git commit -m "chore: initial publish of${{ steps.check.outputs.unpublished }}"
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Push release branch
        if: steps.check.outputs.needs_release == 'true' && (steps.smart-release.outputs.has_changes == 'true' || steps.unpublished.outputs.has_changes == 'true' || steps.zim-bump.outputs.bumped == 'true')
        run: |
          # Push branch (no tags to push)
          git push -u origin release-automation --force

      - name: Create or update PR
        if: steps.check.outputs.needs_release == 'true' && (steps.smart-release.outputs.has_changes == 'true' || steps.unpublished.outputs.has_changes == 'true' || steps.zim-bump.outputs.bumped == 'true')
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          PR_NUM=$(gh pr list --head release-automation --base main --json number --jq '.[0].number')

          # Get version info from Cargo.toml
          CRYPTO_VERSION=$(grep "^version" crates/zim-crypto/Cargo.toml | cut -d'"' -f2)
          DID_VERSION=$(grep "^version" crates/zim-did/Cargo.toml | cut -d'"' -f2)
          CORE_VERSION=$(grep "^version" crates/zim-core/Cargo.toml | cut -d'"' -f2)
          API_VERSION=$(grep "^version" crates/zim-api/Cargo.toml | cut -d'"' -f2)
          PEER_VERSION=$(grep "^version" crates/zim-peer/Cargo.toml | cut -d'"' -f2)
          ZIM_VERSION=$(grep "^version" crates/zim/Cargo.toml | head -1 | cut -d'"' -f2)

          PR_BODY="## Release Updates

          This PR contains automated version bumps and changelog updates based on conventional commits.

          ### New versions:
          - zim-crypto v$CRYPTO_VERSION
          - zim-did v$DID_VERSION
          - zim-core v$CORE_VERSION
          - zim-api v$API_VERSION
          - zim-peer v$PEER_VERSION
          - zim v$ZIM_VERSION (binary — GitHub Release, not crates.io)

          ### What happens when merged:
          1. Tags will be created automatically
          2. Lib crates will be published to crates.io
          3. The zim-v tag triggers CLI binary builds + the GHCR hub image

          ### What to review:
          - Version bumps in \`Cargo.toml\` files
          - \`CHANGELOG.md\` updates
          - Ensure conventional commits are categorized correctly

          ---
          Generated by [Release PR Workflow](.github/workflows/release-pr.yml)"

          if [ -z "$PR_NUM" ]; then
            # Create new PR
            gh pr create \
              --base main \
              --head release-automation \
              --title "chore: release updates" \
              --body "$PR_BODY"
            echo "Created new release PR"
          else
            # Update existing PR
            gh pr edit "$PR_NUM" --body "$PR_BODY"
            echo "Updated existing release PR #$PR_NUM"
          fi
