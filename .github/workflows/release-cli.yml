name: Release CLI

on:
  push:
    tags:
      - "zim-peer-v*"
    branches:
      - main
    paths:
      - ".github/workflows/release-cli.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.9)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Only run for tag pushes or manual dispatch (not workflow file changes)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            fuse: false
            features: "--no-default-features"
            artifact: zim-darwin-arm64

          - name: macOS Apple Silicon (FUSE)
            runner: macos-latest
            target: aarch64-apple-darwin
            fuse: true
            features: ""
            artifact: zim-darwin-arm64-fuse

          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            fuse: false
            features: "--no-default-features"
            artifact: zim-linux-x64

          - name: Linux x86_64 (FUSE)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            fuse: true
            features: ""
            artifact: zim-linux-x64-fuse

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macFUSE
        if: matrix.fuse && startsWith(matrix.runner, 'macos')
        run: brew install --cask macfuse

      - name: Install Linux FUSE dependencies
        if: matrix.fuse && startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cli-release-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cli-release-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.fuse }}-cli-release-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.fuse }}-cli-release-build-

      - name: Build release binary
        run: cargo build --release --package zim-peer --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#zim-peer-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Rename binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp "target/${{ matrix.target }}/release/zim" "${{ matrix.artifact }}-${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    # Run even if some builds fail - we'll release what's available
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=zim-peer-v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#zim-peer-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Make binaries executable
        run: chmod +x artifacts/zim-*/zim-*

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name 'zim-*' -exec sha256sum {} \; | sort > ../checksums.txt
          cat ../checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: zim v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/zim-*/zim-*
            checksums.txt
          body: |
            ## zim v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Binary | FUSE Mount Support |
            |----------|--------|--------------------|
            | macOS (Apple Silicon) | `zim-darwin-arm64-${{ steps.version.outputs.version }}` | No |
            | macOS (Apple Silicon + FUSE) | `zim-darwin-arm64-fuse-${{ steps.version.outputs.version }}` | Yes (requires [macFUSE](https://osxfuse.github.io/)) |
            | Linux (x86_64) | `zim-linux-x64-${{ steps.version.outputs.version }}` | No |
            | Linux (x86_64 + FUSE) | `zim-linux-x64-fuse-${{ steps.version.outputs.version }}` | Yes (requires libfuse3) |

            ### Install

            See [install.sh](../../install.sh) at the repository root for the one-line installer (the URL stabilises once the GitHub repo is published under its zim name).

            ### Verify

            ```bash
            zim --help
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
