# Publish web/ (marketing site + end-user docs) to GitHub Pages at
# zim.krondor.org. DNS (the CNAME record) lives in zim-iac's terraform;
# the custom domain must also be set once in Settings → Pages.
#
# Also serves the iOS app's SideStore source at /ios/sidestore.json:
# copied from the newest zim-ios-v* release at build time. release-ios.yml
# dispatches this workflow after each iOS release.

name: Pages

on:
  push:
    branches: [main]
    paths: [web/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: web
      - run: cd web && bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: SideStore source from the newest iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName | select(startswith("zim-ios-v"))][0] // empty')
          if [ -z "$TAG" ]; then
            echo "no zim-ios-v* release yet; skipping /ios/sidestore.json"
            exit 0
          fi
          mkdir -p web/_site/ios
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern sidestore.json --dir web/_site/ios
          echo "serving $TAG's sidestore.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
