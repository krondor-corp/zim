# Zim hub: dumb-blob-store + DID/escrow rendezvous for browser-resident
# verification methods. Phase 1 (this commit): revival to compile-clean
# against the current zim crate surface. No auth, no escrow, no DID
# hosting yet — those land in later phases (see docs/research/hub-revival.md).
[package]
name = "zim-hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim read-only web mirror gateway: ciphertext + log mirror with browser-side decryption via zim-wasm."
keywords.workspace = true
categories.workspace = true
readme = "README.md"
build = "build.rs"

[lib]
name = "zim_hub"
path = "src/lib.rs"

[[bin]]
name = "zim-hub"
path = "src/main.rs"

# Dev-only hub state seeder: writes the user + daemon device rows that
# a successful `zim login` would produce, skipping the device-code
# browser dance. See src/bin/devseed.rs.
[[bin]]
name = "zim-hub-devseed"
path = "src/bin/devseed.rs"

[dependencies]
# workspace — in-process peer Service surface
zim = { path = "../zim", version = "0.1.0" }
# Shared API contract: the server serializes these wire types; the CLI +
# web SPA deserialize them. Routes here MUST mirror the request types in
# `zim_api::hub` (no compile-time link — see each request's doc comment).
zim-api = { path = "../zim-api", version = "0.1.0", default-features = false, features = ["hub"] }
zim-core = { path = "../zim-core", version = "0.1.0" }
zim-did = { path = "../zim-did", version = "0.1.0" }
zim-runtime = { path = "../zim-runtime", version = "0.1.0" }
zim-peer = { path = "../zim-peer", version = "0.1.0" }
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }

# web + service
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "set-header"] }
http = { workspace = true }

# templates + static
rust-embed = "8.5"
mime_guess = { workspace = true }

# async + runtime
tokio = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
bytes = { workspace = true }

# storage — sqlx so the hub can swap to Postgres without rewriting
# queries. SQLite is the default in dev / single-node deployments;
# Postgres lands behind a feature flag when the first multi-node hub
# does. We use runtime `sqlx::query` (not the compile-time-checked
# `query!` macro) so neither DATABASE_URL nor a build-time DB is
# required.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# core
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
base64 = "0.22"

# Google OAuth login (single-owner gate). Hand-rolled flow against
# Google's `/o/oauth2/v2/auth` + `/oauth2.googleapis.com/token`, with
# the session represented as an HS256 JWT cookie. ID-token signature
# isn't separately verified — the token arrives over TLS direct from
# Google's token endpoint and we audience+issuer-check the claims.
reqwest = { workspace = true }
jsonwebtoken = "9"
urlencoding = "2"
chrono = { workspace = true }
rand = "0.8"
toml = "0.8"
struct-patch = { version = "0.8", features = ["status"] }
url = { workspace = true }
hex = "0.4"
