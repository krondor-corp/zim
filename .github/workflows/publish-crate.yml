name: Publish to crates.io

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    # Run when release PR is merged (version bump or initial publish) OR manual trigger
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bump zim-') || contains(github.event.head_commit.message, 'chore: initial publish of zim-')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE development libraries
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tags
        run: |
          # Read versions from Cargo.toml files
          CRYPTO_VERSION=$(grep "^version" crates/zim-crypto/Cargo.toml | cut -d'"' -f2)
          STORE_VERSION=$(grep "^version" crates/zim-store/Cargo.toml | cut -d'"' -f2)
          FS_VERSION=$(grep "^version" crates/zim-fs/Cargo.toml | cut -d'"' -f2)
          PROTOCOL_VERSION=$(grep "^version" crates/zim-protocol/Cargo.toml | cut -d'"' -f2)
          PEER_VERSION=$(grep "^version" crates/zim-peer/Cargo.toml | cut -d'"' -f2)

          echo "Creating tags for:"
          echo "  zim-crypto v$CRYPTO_VERSION"
          echo "  zim-store v$STORE_VERSION"
          echo "  zim-fs v$FS_VERSION"
          echo "  zim-protocol v$PROTOCOL_VERSION"
          echo "  zim-peer v$PEER_VERSION"

          # Create and push tags (skip if already exists)
          for tag in "zim-crypto-v$CRYPTO_VERSION" "zim-store-v$STORE_VERSION" "zim-fs-v$FS_VERSION" "zim-protocol-v$PROTOCOL_VERSION" "zim-peer-v$PEER_VERSION"; do
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists, skipping"
            else
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
              echo "Created and pushed $tag"
            fi
          done

          echo "Tags processed successfully"

      # Publish in dependency order: crypto → store → fs → protocol → peer.
      # Each step waits 90s for crates.io indexing before the next.

      - name: Publish zim-crypto
        run: |
          cd crates/zim-crypto
          echo "Publishing zim-crypto..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-crypto publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (zim-crypto)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-crypto..."
          sleep 90

      - name: Publish zim-store
        run: |
          cd crates/zim-store
          echo "Publishing zim-store..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-store publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (zim-store)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-store..."
          sleep 90

      - name: Publish zim-fs
        run: |
          cd crates/zim-fs
          echo "Publishing zim-fs..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-fs publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (zim-fs)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-fs..."
          sleep 90

      - name: Publish zim-protocol
        run: |
          cd crates/zim-protocol
          echo "Publishing zim-protocol..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-protocol publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (zim-protocol)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-protocol..."
          sleep 90

      - name: Publish zim-peer
        run: |
          cd crates/zim-peer
          echo "Publishing zim-peer..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-peer publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Summary
        run: |
          CRYPTO_VERSION=$(grep "^version" crates/zim-crypto/Cargo.toml | cut -d'"' -f2)
          STORE_VERSION=$(grep "^version" crates/zim-store/Cargo.toml | cut -d'"' -f2)
          FS_VERSION=$(grep "^version" crates/zim-fs/Cargo.toml | cut -d'"' -f2)
          PROTOCOL_VERSION=$(grep "^version" crates/zim-protocol/Cargo.toml | cut -d'"' -f2)
          PEER_VERSION=$(grep "^version" crates/zim-peer/Cargo.toml | cut -d'"' -f2)
          echo "Release complete!"
          echo "   - zim-crypto v$CRYPTO_VERSION"
          echo "   - zim-store v$STORE_VERSION"
          echo "   - zim-fs v$FS_VERSION"
          echo "   - zim-protocol v$PROTOCOL_VERSION"
          echo "   - zim-peer v$PEER_VERSION"
          echo ""
          echo "Check crates.io:"
          echo "   - https://crates.io/crates/zim-crypto"
          echo "   - https://crates.io/crates/zim-store"
          echo "   - https://crates.io/crates/zim-fs"
          echo "   - https://crates.io/crates/zim-protocol"
          echo "   - https://crates.io/crates/zim-peer"
