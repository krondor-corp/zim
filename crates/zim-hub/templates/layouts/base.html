<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}zim-hub{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/vendor/datastar.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">zim-hub</a>
      <nav class="site-nav">
        <a href="/">home</a>
      </nav>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>zim-hub · read-only web mirror</span>
    </footer>
  </body>
</html>
