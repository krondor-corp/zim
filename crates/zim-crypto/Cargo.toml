[package]
name = "zim-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cryptographic primitives for Zim: Ed25519/X25519 identity, ChaCha20-Poly1305 content encryption, X25519-based secret sharing"
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_crypto"
path = "src/lib.rs"

[features]
# Default for the daemon/peer/protocol/hub/store binaries: PublicKey/SecretKey
# wrap iroh's Ed25519 types so they Deref to iroh::PublicKey / NodeId for free.
default = ["iroh-keys"]
iroh-keys = ["dep:iroh"]
# Browser target: opts out of iroh (its networking/runtime stack doesn't
# compile to wasm32-unknown-unknown). PublicKey/SecretKey wrap ed25519-dalek
# directly. Enable via `default-features = false, features = ["wasm"]`.
wasm = []

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
bincode = { workspace = true }
pem = { workspace = true }
rand = "0.9"
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
hex = "0.4"

# iroh PublicKey/SecretKey wrappers (gated for wasm builds)
iroh = { workspace = true, optional = true }

# crypto primitives
aes-kw = { version = "0.2", features = ["alloc"] }
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.0"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
blake3 = "1.5"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
