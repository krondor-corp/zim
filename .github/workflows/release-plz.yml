name: Release PR

# The release train (see release-plz.toml):
#
#   push to main    → `release-pr` refreshes the standing release PR
#                     (bumps + changelogs; nothing is released).
#   merge that PR   → `release` tags every released crate and publishes
#                     the workspace to crates.io in dependency order.
#
# The iOS app (crates/zim-ios, its own Cargo workspace) runs the same
# train in parallel (jobs release-ios / release-pr-ios, bin/ios-release-pr):
# its own "chore(ios): release" PR; merging it tags zim-ios-v*, which
# triggers release-ios.yml.
#
# All jobs run with RELEASE_PAT: the release PRs get real CI, and the
# pushed zim-v* / zim-ios-v* tags natively trigger release-cli.yml +
# images.yml / release-ios.yml (GITHUB_TOKEN-pushed tags never trigger
# workflows — GitHub's recursion guard).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # On merge of the release PR: tag + publish anything unreleased.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # On every main push: create/refresh the standing release PR.
  release-pr:
    runs-on: ubuntu-latest
    needs: release # serialize: never race the tagger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # iOS app: when its release PR merges, tag zim-ios-v<version>. The
  # squash-merge subject is the PR title, "chore(ios): release vX (#N)";
  # anything else (or an already-tagged version) tags nothing.
  release-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag a merged iOS release PR
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/zim-ios/Cargo.toml | head -1)
          TAG="zim-ios-v$VERSION"
          SUBJECT=$(git log -1 --format=%s)
          case "$SUBJECT" in
            "chore(ios): release v$VERSION"*) ;;
            *) echo "not an iOS release merge: $SUBJECT"; exit 0 ;;
          esac
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "pushed $TAG — Release iOS takes it from here"

  # iOS app: create/refresh its standing release PR (bin/ios-release-pr;
  # release-plz can't: its git-only mode needs the manifest at the repo
  # root, and crates/zim-ios is its own workspace).
  release-pr-ios:
    runs-on: ubuntu-latest
    needs: release-ios # serialize: see the tag before picking a version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Prepare the release
        id: prep
        run: echo "version=$(bin/ios-release-pr "$RUNNER_TEMP/ios-release-body.md")" >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.prep.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: release-ios
          base: main
          title: "chore(ios): release v${{ steps.prep.outputs.version }}"
          commit-message: "chore(ios): release v${{ steps.prep.outputs.version }}"
          body-path: ${{ runner.temp }}/ios-release-body.md
          add-paths: |
            crates/zim-ios/Cargo.toml
            crates/zim-ios/Cargo.lock
            crates/zim-ios/CHANGELOG.md
          delete-branch: true
