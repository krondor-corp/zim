name: Release PR

# The release train (see release-plz.toml):
#
#   push to main    → `release-pr` refreshes the standing release PR
#                     (bumps + changelogs; nothing is released).
#   merge that PR   → `release` tags every released crate and publishes
#                     the workspace to crates.io in dependency order.
#
# The iOS app (crates/zim-ios, its own Cargo workspace) runs the same
# train in parallel from crates/zim-ios/release-plz.toml: its own
# "chore(ios): release" PR; merging it tags zim-ios-v*, which triggers
# release-ios.yml.
#
# All jobs run with RELEASE_PAT: the release PRs get real CI, and the
# pushed zim-v* / zim-ios-v* tags natively trigger release-cli.yml +
# images.yml / release-ios.yml (GITHUB_TOKEN-pushed tags never trigger
# workflows — GitHub's recursion guard).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # On merge of the release PR: tag + publish anything unreleased.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # On every main push: create/refresh the standing release PR.
  release-pr:
    runs-on: ubuntu-latest
    needs: release # serialize: never race the tagger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # iOS app: tag zim-ios-v* when its release PR merges (no crates.io).
  release-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release (iOS)
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: crates/zim-ios/Cargo.toml
          config: crates/zim-ios/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # iOS app: create/refresh its standing release PR.
  release-pr-ios:
    runs-on: ubuntu-latest
    needs: release-ios # serialize: never race the tagger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release-pr (iOS)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: crates/zim-ios/Cargo.toml
          config: crates/zim-ios/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
