name: Publish to crates.io

# Second half of the release train (see release-pr.yml): fires when the
# release-automation PR merges. Creates the per-crate tags — the
# zim-v* tag is pushed with the PAT, so it natively triggers
# release-cli.yml (binaries) and images.yml (GHCR) — then publishes
# the lib stack to crates.io in dependency order. The zim binary is
# publish=false (name taken on crates.io); its tag is its release.

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    # Run when release PR is merged (version bump or initial publish) OR manual trigger
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bump zim-') || contains(github.event.head_commit.message, 'Bump zim ') || contains(github.event.head_commit.message, 'chore: initial publish of zim-')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tags
        run: |
          # Read versions from Cargo.toml files
          CRYPTO_VERSION=$(grep "^version" crates/zim-crypto/Cargo.toml | cut -d'"' -f2)
          DID_VERSION=$(grep "^version" crates/zim-did/Cargo.toml | cut -d'"' -f2)
          CORE_VERSION=$(grep "^version" crates/zim-core/Cargo.toml | cut -d'"' -f2)
          API_VERSION=$(grep "^version" crates/zim-api/Cargo.toml | cut -d'"' -f2)
          PEER_VERSION=$(grep "^version" crates/zim-peer/Cargo.toml | cut -d'"' -f2)
          ZIM_VERSION=$(grep "^version" crates/zim/Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Creating tags for:"
          echo "  zim-crypto v$CRYPTO_VERSION"
          echo "  zim-did v$DID_VERSION"
          echo "  zim-core v$CORE_VERSION"
          echo "  zim-api v$API_VERSION"
          echo "  zim-peer v$PEER_VERSION"
          echo "  zim v$ZIM_VERSION"

          # Create and push tags (skip if already exists)
          for tag in "zim-crypto-v$CRYPTO_VERSION" "zim-did-v$DID_VERSION" "zim-core-v$CORE_VERSION" "zim-api-v$API_VERSION" "zim-peer-v$PEER_VERSION" "zim-v$ZIM_VERSION"; do
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists, skipping"
            else
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
              echo "Created and pushed $tag"
            fi
          done

          echo "Tags processed successfully"

      - name: Publish zim-crypto
        run: |
          cd crates/zim-crypto
          echo "Publishing zim-crypto..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-crypto publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (crypto)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-crypto..."
          sleep 90

      - name: Publish zim-did
        run: |
          cd crates/zim-did
          echo "Publishing zim-did..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-did publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (did)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-did..."
          sleep 90

      - name: Publish zim-core
        run: |
          cd crates/zim-core
          echo "Publishing zim-core..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-core publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (core)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-core..."
          sleep 90

      - name: Publish zim-api
        run: |
          cd crates/zim-api
          echo "Publishing zim-api..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-api publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing (api)
        run: |
          echo "Waiting 90 seconds for crates.io to index zim-api..."
          sleep 90

      - name: Publish zim-peer
        run: |
          cd crates/zim-peer
          echo "Publishing zim-peer..."
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "zim-peer publish failed or already published"
          cd ../..
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Summary
        run: |
          CRYPTO_VERSION=$(grep "^version" crates/zim-crypto/Cargo.toml | cut -d'"' -f2)
          DID_VERSION=$(grep "^version" crates/zim-did/Cargo.toml | cut -d'"' -f2)
          CORE_VERSION=$(grep "^version" crates/zim-core/Cargo.toml | cut -d'"' -f2)
          API_VERSION=$(grep "^version" crates/zim-api/Cargo.toml | cut -d'"' -f2)
          PEER_VERSION=$(grep "^version" crates/zim-peer/Cargo.toml | cut -d'"' -f2)
          ZIM_VERSION=$(grep "^version" crates/zim/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Release complete!"
          echo "   - zim-crypto v$CRYPTO_VERSION"
          echo "   - zim-did v$DID_VERSION"
          echo "   - zim-core v$CORE_VERSION"
          echo "   - zim-api v$API_VERSION"
          echo "   - zim-peer v$PEER_VERSION"
          echo "   - zim v$ZIM_VERSION (binaries via zim-v$ZIM_VERSION tag)"
          echo ""
          echo "Check crates.io:"
          echo "   - https://crates.io/crates/zim-crypto"
          echo "   - https://crates.io/crates/zim-did"
          echo "   - https://crates.io/crates/zim-core"
          echo "   - https://crates.io/crates/zim-api"
          echo "   - https://crates.io/crates/zim-peer"
