{% extends "auth/base.html" %}
{% block body %}
<form method="post" action="/auth/dev/login">
  <div class="error" style="margin-bottom:0.75rem;">⚠ Development only — if you see this in production, something is wrong. Fix immediately.</div>
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
</form>
<p class="dim" style="text-align:center;margin-top:1rem;"><a href="/auth/login?next={{ next_encoded }}">Other sign-in options</a></p>
{% endblock %}
