name: Release Desktop

# The desktop app is a zim release: it bundles the zim daemon as its
# sidecar, so it is built on the same zim-v* tag as the CLI and attached
# to the GitHub Release that release-cli.yml creates. No separate version
# train — the version is stamped from the tag at build time.

on:
  push:
    tags:
      - "zim-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and attach (e.g. 0.1.9); the zim-v<version> release must exist or be about to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            fuse: false
            features: hub
            suffix: ""
            artifact: zim-desktop-macos-arm64

          - name: macOS Apple Silicon (FUSE)
            runner: macos-latest
            target: aarch64-apple-darwin
            fuse: true
            features: hub,fuse
            suffix: "_fuse"
            artifact: zim-desktop-macos-arm64-fuse

          # 22.04 on purpose: the AppImage links the build host's glibc.
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            fuse: false
            features: hub
            suffix: ""
            artifact: zim-desktop-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/zim-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install macFUSE
        if: matrix.fuse
        run: brew install --cask macfuse

      - name: Install Linux system dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-release-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-desktop-release-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            target
            crates/zim-desktop/target
            crates/zim-hub/web/target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.fuse }}-desktop-release-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.fuse }}-desktop-release-build-

      # No package.json here, so tauri-cli comes from crates.io, cached
      # by version rather than rebuilt every run.
      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-tauri-2.9.6

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.9.6 --locked

      - name: Build the zim sidecar
        run: make desktop-sidecar PROFILE=release FEATURES=${{ matrix.features }}

      # The version comes from the tag, so tauri.conf.json's own
      # `version` is a placeholder and there is no file to bump.
      - name: Build the app (frontend via trunk, then bundle)
        working-directory: crates/zim-desktop
        run: cargo tauri build --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Suffix the FUSE DMG
        if: matrix.suffix != ''
        run: |
          for f in crates/zim-desktop/target/release/bundle/dmg/*.dmg; do
            mv "$f" "${f%.dmg}${{ matrix.suffix }}.dmg"
          done

      - name: Upload macOS artifacts
        if: startsWith(matrix.runner, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: crates/zim-desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: startsWith(matrix.runner, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            crates/zim-desktop/target/release/bundle/deb/*.deb
            crates/zim-desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  attach:
    name: Attach to Release
    needs: build
    # Attach whatever built, like release-cli.yml releases what's available.
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=zim-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # release-cli.yml owns creating the release (title, body, CLI
      # binaries) from the same tag. Creating it here too would race it,
      # so wait for it to exist and only upload.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            echo "release ${{ steps.version.outputs.tag }} not there yet ($i/90)"
            sleep 20
          done
          echo "release-cli.yml never created ${{ steps.version.outputs.tag }}" >&2
          exit 1

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 |
            xargs -0 gh release upload "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber
