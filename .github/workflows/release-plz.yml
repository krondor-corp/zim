name: Release PR

# The release train (see release-plz.toml):
#
#   push to main    → `release-pr` refreshes the standing release PR
#                     (bumps + changelogs; nothing is released).
#   merge that PR   → `release` tags every released crate and publishes
#                     the workspace to crates.io in dependency order.
#
# Both jobs run with PAT_TOKEN: the release PR gets real CI, and the
# pushed zim-v* tag natively triggers release-cli.yml + images.yml
# (GITHUB_TOKEN-pushed tags never trigger workflows — GitHub's
# recursion guard).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # On merge of the release PR: tag + publish anything unreleased.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # On every main push: create/refresh the standing release PR.
  release-pr:
    runs-on: ubuntu-latest
    needs: release # serialize: never race the tagger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
