name: Release iOS (SideStore)

# The iOS app ships with every zim release as an unsigned Zim.ipa plus a
# SideStore/AltStore source (sidestore.json), attached to the GitHub
# Release that release-cli.yml creates from the same zim-v* tag. Users add
#   https://github.com/krondor-corp/zim/releases/latest/download/sidestore.json
# as a source once; SideStore re-signs the IPA with their Apple ID and
# picks up each new release from there. No signing secrets are involved.
#
# Pull requests that touch the app build the same IPA as a workflow
# artifact (nothing is published), so a broken iOS build shows up on the
# PR rather than on the release tag.

on:
  push:
    tags:
      - "zim-v*"
  pull_request:
    paths:
      - "crates/zim-ios/**"
      - "bin/ios-ipa"
      - "bin/sidestore-source"
      - ".github/workflows/release-ios.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and attach (e.g. 0.1.9); the zim-v<version> release must exist or be about to"
        required: true

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  ipa:
    name: Build Zim.ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          # iOS wants a plain dotted version (CFBundleShortVersionString),
          # so PR builds keep the app's own and only the artifact name
          # carries the PR/run.
          case "${{ github.event_name }}" in
            workflow_dispatch) VERSION="${{ github.event.inputs.version }}"; LABEL="$VERSION" ;;
            push)              VERSION="${GITHUB_REF#refs/tags/zim-v}"; LABEL="$VERSION" ;;
            *)                 VERSION="$(jq -r .version crates/zim-ios/tauri.conf.json)"
                               LABEL="pr${{ github.event.pull_request.number }}-run${{ github.run_number }}" ;;
          esac
          {
            echo "version=$VERSION"
            echo "label=$LABEL"
            echo "tag=zim-v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # Pinned to the version the Xcode project's build phase was
      # generated with; binstall falls back to a source build if no
      # prebuilt binary matches.
      - name: Install tauri-cli
        run: cargo binstall --no-confirm --locked tauri-cli@2.9.6

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/zim-ios/target
          key: ios-release-${{ hashFiles('crates/zim-ios/Cargo.lock') }}
          restore-keys: ios-release-

      - name: Build IPA
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/zim-ios/target
        run: bin/ios-ipa "${{ steps.version.outputs.version }}" "$PWD/out/Zim.ipa"

      - name: Write SideStore source
        run: bin/sidestore-source "${{ steps.version.outputs.version }}" out/Zim.ipa > out/sidestore.json

      - name: Checksum
        run: (cd out && shasum -a 256 Zim.ipa > Zim.ipa.sha256 && cat Zim.ipa.sha256)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zim-${{ steps.version.outputs.label }}
          path: out/
          if-no-files-found: error

      # release-cli.yml owns creating the release from the same tag;
      # creating it here would race it, so wait for it and only upload.
      - name: Wait for the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            echo "release ${{ steps.version.outputs.tag }} not there yet ($i/90)"
            sleep 20
          done
          echo "release-cli.yml never created ${{ steps.version.outputs.tag }}" >&2
          exit 1

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" out/Zim.ipa out/Zim.ipa.sha256 out/sidestore.json --repo "$GITHUB_REPOSITORY" --clobber
