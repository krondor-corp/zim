# Scoped per-crate config. Affects builds initiated from inside crates/zim-wasm/
# (e.g. `wasm-pack build crates/zim-wasm`). Does not affect host or other-crate
# builds, which find the workspace-root .cargo/config.toml (or none) first.
#
# Required because getrandom 0.3+ no longer auto-detects wasm32-unknown-unknown
# as a JS-runtime target; the consumer must opt in via this cfg flag.
# See: https://docs.rs/getrandom/0.3/#webassembly-support

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
