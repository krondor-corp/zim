name: CI

# Changes that touch only the iOS app skip this: crates/zim-ios is its
# own Cargo workspace (not built here) and release-ios.yml builds it on
# its PRs. A change touching anything else still runs everything.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "crates/zim-ios/**"
      - "bin/ios-ipa"
      - "bin/ios-release-pr"
      - "bin/sidestore-source"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "crates/zim-ios/**"
      - "bin/ios-ipa"
      - "bin/ios-release-pr"
      - "bin/sidestore-source"

jobs:
  # Rust CI (daemon + library crates)
  rust-ci:
    name: Rust CI
    uses: ./.github/workflows/ci-rust.yml

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-ci]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
