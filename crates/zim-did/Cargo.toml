[package]
name = "zim-did"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DID (Decentralized Identifier) types for Zim: did:key + did:web identity handles built on zim-crypto."
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_did"
path = "src/lib.rs"

[dependencies]
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }

async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
percent-encoding = "2"

# HTTP-backed did:web resolver lives here so peers (daemon + hub) can
# resolve identities without each app rebuilding it.
reqwest = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
