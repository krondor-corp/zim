[package]
name = "zim-ios"
version = "0.1.0"
description = "iOS shell for the zim hub: the hosted SPA in a Tauri webview, with Google sign-in handed to a system web-auth session"
edition = "2021"
license = "MIT"
publish = false

# Standalone (own workspace): pulls Tauri, which the host `cargo build`
# must not. Built with `cargo tauri ios …` from this directory.
[workspace]

[lib]
name = "zim_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-zim-web-auth = { path = "plugins/web-auth" }
tokio = { version = "1", features = ["rt"] }
url = "2"
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
