[package]
name = "zim-fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FUSE filesystem for Zim vaults — mount an end-to-end-encrypted vault as a local directory."
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_fuse"
path = "src/lib.rs"

[features]
# Off by default so the workspace build / CI doesn't need libfuse/macFUSE.
# The daemon's release build turns it on; verify locally with
# `cargo build -p zim-fuse --features mount`.
default = []
mount = ["dep:fuser", "dep:moka", "dep:libc"]

[dependencies]
# Generic over Vault<B, L> — the daemon instantiates it with its local
# BlobsProvider + SqliteVaultLog; tests can use in-memory stores.
zim-core = { path = "../zim-core", version = "0.1.0" }

tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }

# Mount-only deps (feature `mount`).
# - abi-7-31: parse RENAME2 (and newer ops) so macOS `mv` dispatches to our
#   rename instead of returning ENOSYS.
# - macfuse-4-compat: modern macFUSE (4.x) changed some struct layouts; without
#   this, fuser misparses its messages.
fuser = { version = "0.15", optional = true, features = ["abi-7-31", "macfuse-4-compat"] }
moka = { version = "0.12", features = ["sync"], optional = true }
libc = { version = "0.2", optional = true }
