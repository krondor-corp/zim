[package]
name = "zim-hub-wasm"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Browser-side WASM client for zim-hub: encrypts/decrypts vault content, builds manifests."
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
# Required by the `#[wasm_bindgen]` macro to lower async methods to JS promises.
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
# On wasm32 reqwest compiles to a `fetch`-backed client (its TLS/tokio
# backends are target-gated to non-wasm), so the browser HTTP client is
# the same crate the daemon uses. We only buffer whole bodies (`.bytes()`),
# never stream, so reqwest's lack of wasm response streaming is moot.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
ipld-core = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
blake3 = "1"
bytes = { workspace = true }
# wasm is single-threaded; SendWrapper lets the !Send `fetch` future
# satisfy the `Send` bound that `#[async_trait]` puts on BlobStore/VaultLog.
send_wrapper = { version = "0.6", features = ["futures"] }
hex = "0.4"
base64 = "0.22"
url = { workspace = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
serde_bytes = "0.11"
# Console diagnostics from the SDK (e.g. how many devices a new vault shared to).
web-sys = { version = "0.3", features = ["console"] }

# zim-core is iroh-free and wasm-clean by construction (no features).
zim-core = { path = "../../zim-core" }
zim-crypto = { path = "../../zim-crypto" }
# Shared wire types for the hub's vault mirror surface (head/log/blob) —
# the same definitions the hub server serializes.
zim-api = { path = "../../zim-api", features = ["hub", "vault"] }
# did:key decode for resolving a user's DID document to its pubkey set.
# (zim-did is pure — no HTTP stack — so no feature gymnastics needed.)
zim-did = { path = "../../zim-did" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
futures = { workspace = true }
