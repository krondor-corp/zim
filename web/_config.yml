title: Zim
tagline: End-to-end encrypted peer-to-peer storage
description: Built on iroh-blobs with ChaCha20-Poly1305 encryption and X25519 secret sharing.
baseurl: ""
url: ""

markdown: kramdown
highlighter: rouge

collections:
  docs:
    output: true
    permalink: /docs/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
  - scope:
      path: "index.md"
    values:
      layout: home

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile

brand:
  primary_color: "#111111"
  accent_color: "#4a4a4a"
  tagline: "End-to-end encrypted peer-to-peer storage"
