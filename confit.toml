# zim's confit config: per-branch dev ports and names. No secrets.
#
# confit (https://confit.krondor.org) is a required dev tool, like
# cargo. `./bin/dev` resolves this once at startup, so every worktree
# of this clone gets its own daemon/hub ports, tmux session, and minio
# bucket and can run its dev env alongside the others.
#
#   ports.infra.*    = band + offset         same on every branch (shared minio)
#   ports.services.* = band + lane + slot    slot 0 on `main`, else lowest free 1-9
#
# Band map (17100 + offset/lane):
#   1711x  alice   — 17110 on main, 17111..17119 for worktree slots 1-9
#   1712x  bob     — 17120 on main, 17121..17129
#   1718x  infra   — minio API 17180, console 17181 (shared by every worktree)
#   1719x  hub     — 17190 on main, 17191..17199
# Outside the band (one at a time, not per worktree): the standalone
# daemon default 17171, the web/ site on 17200, its livereload on 17210.
# `make e2e` picks free ports at boot.
#
# The slot ledger lives at <git-common-dir>/confit/ports.toml, shared by
# every worktree; removed worktrees drop out on the next resolve.
# `./bin/dev ports` prints this worktree's slot and ports;
# `confit validate` checks the layout.

[project]
name = "zim"

[ports]
band = 17100

[ports.infra]
minio_api     = 80
minio_console = 81

[ports.services]
alice = 10
bob   = 20
hub   = 90

# The dev peers: each key IS the peer's nick (its data dir `data/<nick>/`,
# tmux pane label, and `alice …` shell function after
# `eval "$(./bin/dev shell)"`), each value its daemon API port. Adding a
# node = a lane above + a line here. `bin/dev` reads this with
# `confit show dev.nodes`; `zim-e2e` reads only the keys (it picks its
# own ports). Fixtures default to the first nick in sorted order.
[dev.nodes]
alice = "{ports.services.alice}"
bob   = "{ports.services.bob}"

[env.dev]
HUB_PORT           = "{ports.services.hub}"
MINIO_API_PORT     = "{ports.infra.minio_api}"
MINIO_CONSOLE_PORT = "{ports.infra.minio_console}"
ZIM_DEV_SLOT       = "{ports.slot}"
ZIM_DEV_SLUG       = "{ports.slug}"
