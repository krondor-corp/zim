[package]
name = "zim-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim wire protocol: peer-to-peer messaging, sync jobs, handshake, append-only bucket log"
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_protocol"
path = "src/lib.rs"

[dependencies]
# workspace crates
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }
zim-fs = { path = "../zim-fs", version = "0.1.0" }
zim-store = { path = "../zim-store", version = "0.1.0" }

# core
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"

# serialization
serde = { workspace = true }
serde_with = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }

# iroh
iroh = { workspace = true }
iroh-blobs = { workspace = true }
cid = { workspace = true }
ipld-core = { workspace = true }

# misc
sha2 = "0.10"
hex = "0.4"
uuid = { workspace = true }
parking_lot = { workspace = true }
flume = "0.11"

# concurrency
tokio = { workspace = true }
futures = { workspace = true }

# tracing
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
