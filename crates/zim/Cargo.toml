[package]
name = "zim-cli"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim CLI + daemon: command-line interface to a Zim peer, with embedded long-running daemon"
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[lib]
name = "zim"
path = "src/lib.rs"

# Package is `zim-cli` (bare `zim` is taken on crates.io) but the
# installed binary is still `zim`.
[[bin]]
name = "zim"
path = "src/main.rs"

[features]
# Off by default so the daemon builds without libfuse/macFUSE. Release builds
# for end users turn it on: `cargo build -p zim-cli --features fuse`.
default = []
fuse = ["dep:fuser", "dep:moka", "dep:libc"]
# Hub integration: the `zim hub` subcommand + the typed hub client.
# Off by default so a daemon-only `zim` doesn't compile the hub surface.
hub = []

[dependencies]
zim-api = { path = "../zim-api", version = "0.1.1", features = ["hub"] }
zim-core = { path = "../zim-core", version = "0.1.1" }
zim-crypto = { path = "../zim-crypto", version = "0.1.0" }
zim-did = { path = "../zim-did", version = "0.1.0" }
zim-peer = { path = "../zim-peer", version = "0.1.1" }
# FUSE deps (feature `fuse`) — see src/fuse/.
# - abi-7-31: parse RENAME2 (and newer ops) so macOS `mv` dispatches to our
#   rename instead of returning ENOSYS.
# - macfuse-4-compat: modern macFUSE (4.x) changed some struct layouts; without
#   this, fuser misparses its messages.
fuser = { version = "0.15", optional = true, features = ["abi-7-31", "macfuse-4-compat"] }
moka = { version = "0.12", features = ["sync"], optional = true }
libc = { version = "0.2", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
comfy-table = "7.1"
dirs = { workspace = true }
http = { workspace = true }
owo-colors = { version = "4", features = ["supports-colors"] }
reqwest = { workspace = true }
hex = "0.4"
hostname = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
service-manager = "0.8"
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
