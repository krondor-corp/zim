# Release train (release-plz). Trunk-based: every merge to main
# refreshes a standing release PR (version bumps + changelogs from
# conventional commits — fix→patch, feat→minor, breaking→major, 0.x
# rules respected). Merging that PR IS the release: release-plz tags
# and publishes the workspace to crates.io in dependency order.
#
# Tags are pushed with PAT_TOKEN (see release-plz.yml), so the zim-v*
# tag natively triggers release-cli.yml (binaries + GitHub Release)
# and images.yml (GHCR version tag). GitHub Releases stay owned by
# release-cli.yml, so git_release is off here.

[workspace]
git_release_enable = false # release-cli.yml owns the GitHub Release
dependencies_update = false

# The binary crate: published as `zim-cli` (bare `zim` is taken on
# crates.io), tagged zim-v* — the tag the whole release pipeline keys
# on (release-cli.yml, images.yml, `zim update`, install.sh).
[[package]]
name = "zim-cli"
git_tag_name = "zim-v{{ version }}"
# Binary crate — nothing depends on its library API, so semver checks
# are meaningless here. They also build rustdoc in a lockfile-free temp
# workspace, which trips on iroh's pre-release ed25519-dalek (see the
# 2026-10 Release PR failure). Off.
semver_check = false

# zim-peer pulls iroh 0.93, which pins the PRE-RELEASE ed25519-dalek
# 3.0.0-pre.1 → pkcs8 0.11. Our Cargo.lock holds a compatible pkcs8 rc,
# but cargo-semver-checks builds rustdoc in a lockfile-free temp
# workspace, fresh-resolves pkcs8 0.11.0 final, and fails to COMPILE
# ed25519-dalek — a build failure, not an API finding. Off until the
# iroh 1.x migration (which moves to released dalek 3.0.0) lands.
[[package]]
name = "zim-peer"
semver_check = false

# Deployed continuously via GHCR — never versioned/released here.
[[package]]
name = "zim-hub"
release = false
publish = false

[[package]]
name = "zim-hub-wasm"
release = false
publish = false

# Dev tooling — never versioned, released, or published.
[[package]]
name = "zim-e2e"
release = false
publish = false
