[package]
name = "zim-hub-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Yew (Rust/WASM) frontend for zim-hub. Consumes zim-hub-wasm as the SDK."

# Standalone (own workspace): a wasm32-only Yew app built by Trunk, kept out
# of the host `cargo build --workspace`. The empty [workspace] table below
# makes it its own root so it doesn't inherit the parent workspace.
[workspace]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Navigator",
    "Clipboard",
] }
gloo-storage = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
console_error_panic_hook = "0.1"

# The SDK: HubClient / WasmFs / crypto, called directly as Rust.
zim-hub-wasm = { path = "../wasm" }
# Shared hub wire types + the typed client (reqwest's wasm/fetch backend).
# Same `ApiRequest` types the hub server compiles + the CLI calls; the SPA
# additionally speaks the admin page + browser device-code approval.
zim-api = { path = "../../zim-api", features = ["hub", "admin", "grant"] }
