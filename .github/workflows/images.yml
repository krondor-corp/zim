# Build + publish the hub image (docker/Dockerfile.hub — hub server with
# embedded SPA) to ghcr.io/krondor-corp/zim-hub.
#
# Tags: `latest` on main, the version on `zim-v*` release tags, and the
# commit sha always. Deployment stays manual (zim-iac pulls by tag with
# `kamal deploy --skip-push`); this workflow only publishes.
#
# NOTE: the first push creates the package as private — flip
# ghcr.io/krondor-corp/zim-hub to public once in the GitHub package
# settings. (The marketing site is GitHub Pages — see pages.yml.)

name: Hub Image

on:
  push:
    branches: [main]
    tags: ["zim-v*"]
  workflow_dispatch:

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: zim-hub
            dockerfile: docker/Dockerfile.hub
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=zim-v(.*),group=1
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Kamal refuses to run images without a `service` label matching
          # its service name (zim-iac deploys with --skip-push).
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Hand the new main image to krondor-corp/zim-iac, which pins it in a
      # deploy PR (hub-image.yml there); merging that PR deploys it. Tags
      # and manual runs don't dispatch. The token needs Contents write on
      # zim-iac: ZIM_IAC_DISPATCH_TOKEN (a fine-grained PAT scoped to
      # zim-iac) if set, else RELEASE_PAT. A failed dispatch warns; the
      # image is already pushed.
      - name: Ask zim-iac to deploy this image
        if: matrix.name == 'zim-hub' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.ZIM_IAC_DISPATCH_TOKEN || secrets.RELEASE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::no token for zim-iac; not asking it to deploy"
            exit 0
          fi
          if gh api repos/krondor-corp/zim-iac/dispatches \
            -f event_type=zim-hub-image \
            -f "client_payload[version]=sha-${GITHUB_SHA::7}" \
            -f "client_payload[commit]=$GITHUB_SHA"; then
            echo "asked zim-iac to deploy zim-hub:sha-${GITHUB_SHA::7}"
          else
            echo "::warning::could not dispatch to zim-iac (token lacks access?); deploy by hand: zim-iac Actions → Hub image → sha-${GITHUB_SHA::7}"
          fi
