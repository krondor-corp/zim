# Zim hub: read-only web mirror gateway (axum + askama + Datastar).
# Embeds an in-process peer Service — no external zim-peer daemon required.
[package]
name = "zim-hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zim read-only web mirror gateway: server-rendered Askama + Datastar over a single-user workspace, with an embedded peer Service."
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "zim_hub"
path = "src/lib.rs"

[[bin]]
name = "zim-hub"
path = "src/main.rs"

[dependencies]
# workspace crates — in-process peer Service surface
zim-runtime = { path = "../zim-runtime", version = "0.1.0" }
zim-peer = { path = "../zim-peer", version = "0.1.0", default-features = false }
zim-protocol = { path = "../zim-protocol", version = "0.1.0" }
zim-fs = { path = "../zim-fs", version = "0.1.0" }
zim-store = { path = "../zim-store", version = "0.1.0" }

# web + service
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
http = { workspace = true }

# templates + static
askama = { workspace = true }
askama_axum = { workspace = true }
rust-embed = "8.5"
mime_guess = { workspace = true }

# async + runtime
tokio = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }

# observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# identity / auth (T-001a)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "time", "macros", "uuid", "migrate"] }
oauth2 = "5"
tower-cookies = "0.10"
jsonwebtoken = "9"
argon2 = "0.5"

# time / utility
time = { workspace = true, features = ["serde", "formatting"] }

# core
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
