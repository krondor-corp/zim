[package]
name = "zim-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cryptographic primitives for Zim: Ed25519/X25519 identity, ChaCha20-Poly1305 content encryption, X25519-based secret sharing"
keywords.workspace = true
categories.workspace = true

[lib]
name = "zim_crypto"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
bincode = { workspace = true }
pem = { workspace = true }
rand = "0.9"
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"

# iroh PublicKey/SecretKey wrappers
iroh = { workspace = true }

# crypto primitives
aes-kw = { version = "0.2", features = ["alloc"] }
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.0"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
blake3 = "1.5"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
