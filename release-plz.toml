# Smart release train (release-plz), crates.io-free.
#
# Every push to main updates a standing release PR (version bumps +
# changelog from conventional commits). Merging that PR is the whole
# release act: release-plz tags `zim-v<version>`, and the release-plz
# workflow dispatches release-cli.yml (binaries + GitHub Release) and
# images.yml (GHCR version tag) against the new tag.
#
# Nothing publishes to crates.io; workspace crates version-bump quietly
# (no tags, no changelogs) — only the `zim` binary fronts the release.

[workspace]
publish = false
git_release_enable = false # release-cli.yml owns the GitHub Release
git_tag_enable = false
changelog_update = false
dependencies_update = false
semver_check = false # nothing is published; no API-semver gate

[[package]]
name = "zim"
changelog_update = true
git_tag_enable = true
git_tag_name = "zim-v{{ version }}"
